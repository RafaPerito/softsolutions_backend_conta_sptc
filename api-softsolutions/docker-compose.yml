services:
  db:
    image: postgres:16
    container_name: softsolutions_db
    restart: always
    environment:
      POSTGRES_DB: dev_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  meilisearch:
    image: getmeili/meilisearch:v1.15
    container_name: softsolutions_meilisearch
    restart: always
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: "softsolutions_master_key_2026"
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

  api:
    build:
      context: .
    container_name: softsolutions_api
    depends_on:
      - db
      - meilisearch
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/dev_db?sslmode=disable
      MEILI_HOST: http://meilisearch:7700
      MEILI_API_KEY: softsolutions_master_key_2026
      NODE_ENV: production
      PORT: 4000
    ports:
      - "4000:4000"

volumes:
  pg_data:
  meili_data: